<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="bushmasterson — snake.exe"
    />
    <meta
      name="theme-color"
      content="#0f0f10"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#faf8f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="color-scheme"
      content="dark light"
    />

    <meta
      property="og:title"
      content="snake.exe | bushmasterson"
    />
    <meta
      property="og:url"
      content="https://bushmasterson.github.io/snake/"
    />

    <title>snake.exe | bushmasterson</title>

    <script src="../assets/theme-init.js"></script>

    <link
      rel="preconnect"
      href="https://bushmasterson.github.io"
      crossorigin
    />
    <link
      rel="dns-prefetch"
      href="//bushmasterson.github.io"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0f10'/%3E%3Ctext x='16' y='22' font-family='ui-monospace, monospace' font-size='18' font-weight='600' fill='%235cb8ac' text-anchor='middle'%3E%26%26%3C/text%3E%3C/svg%3E"
    />

    <link
      rel="preload"
      as="style"
      href="../assets/css/main.css"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/icons/webfonts/fa-solid-900.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/icons/webfonts/fa-brands-400.woff2"
      crossorigin
    />

    <link
      rel="stylesheet"
      href="../assets/css/main.css"
    />
    <link
      rel="stylesheet"
      href="../assets/icons/css/all.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="../assets/icons/css/all.min.css"
      />
    </noscript>

    <link
      rel="stylesheet"
      href="../assets/css/snake-overlay.css"
    />

    <script
      type="module"
      src="../assets/js/main.js"
    ></script>
  </head>

  <body>
    <button
      id="theme-toggle"
      type="button"
      class="theme-toggle"
      aria-label="Toggle theme"
    >
      <svg
        class="theme-icon theme-icon-sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="4"
          fill="currentColor"
        />
        <g
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M12 2v3" />
          <path d="M12 19v3" />
          <path d="M2 12h3" />
          <path d="M19 12h3" />
          <path d="m4.9 4.9 2.1 2.1" />
          <path d="m17 17 2.1 2.1" />
          <path d="m19.1 4.9-2.1 2.1" />
          <path d="m7 17-2.1 2.1" />
        </g>
      </svg>
      <svg
        class="theme-icon theme-icon-moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
        />
      </svg>
    </button>

    <canvas
      id="particles-canvas"
      aria-hidden="true"
    ></canvas>

    <main
      class="container"
      id="main"
    >
      <article
        class="main-card"
        aria-labelledby="page-title"
      >
        <header>
          <h1
            class="typed-line"
            id="page-title"
          >
            <span aria-hidden="true">
              <span class="prompt">bushmasterson@arch:~$</span>
              <span
                class="typed"
                data-typed="./snake.exe"
                data-speed="100"
                data-delay="400"
              ></span
              ><span class="cursor-blink">|</span>
            </span>
            <span class="sr-only">snake.exe</span>
          </h1>
          <p class="subtitle">
            <span aria-hidden="true">
              <span class="prompt">&gt;</span>
              <span
                class="typed"
                data-typed="classic 8-bit snake."
                data-speed="55"
                data-delay="1400"
              ></span>
            </span>
            <span class="sr-only">classic 8-bit snake.</span>
          </p>
        </header>

        <section
          class="card snake-card"
          aria-label="Snake game"
        >
          <div class="snake-canvas-wrap">
            <canvas
              id="snake-canvas"
              width="320"
              height="320"
            ></canvas>
          </div>

          <div
            class="snake-difficulty"
            role="group"
            aria-label="Difficulty"
          >
            <span class="snake-difficulty-label">speed</span>
            <button
              class="snake-diff-btn snake-diff-btn--low"
              type="button"
              data-difficulty="low"
              aria-pressed="false"
            >
              low
            </button>
            <button
              class="snake-diff-btn snake-diff-btn--medium"
              type="button"
              data-difficulty="medium"
              aria-pressed="false"
            >
              medium
            </button>
            <button
              class="snake-diff-btn snake-diff-btn--high"
              type="button"
              data-difficulty="high"
              aria-pressed="true"
            >
              high
            </button>
          </div>

          <div class="snake-footer">
            <span class="snake-stat">
              <span class="meta-label">score</span>
              <b id="snake-score">0</b>
            </span>
            <span class="snake-stat snake-hint">
              <span class="meta-label">keys</span> ↑↓←→ / wasd · space pause ·
              1/2/3 speed
            </span>
            <span class="snake-stat snake-hint-touch">
              <span class="meta-label">keys</span> swipe to steer · tap to start
            </span>
            <button
              class="snake-restart"
              type="button"
              id="snake-restart"
            >
              restart
            </button>
          </div>
        </section>

        <p class="page-footer">
          <a href="../">← back to home</a>
        </p>
      </article>
    </main>

    <div
      id="snake-gameover"
      class="snake-gameover"
      role="dialog"
      aria-modal="true"
      aria-labelledby="snake-gameover-title"
      hidden
    >
      <div class="snake-gameover-inner">
        <p class="snake-gameover-prompt">bushmasterson@arch:~$ ./snake.exe</p>
        <h2
          class="snake-gameover-title"
          id="snake-gameover-title"
        >
          game over
        </h2>
        <p class="snake-gameover-score">
          <span class="meta-label">score</span>
          <b id="snake-final-score">0</b>
          <span class="snake-gameover-sep">·</span>
          <span class="meta-label">best</span>
          <b id="snake-final-best">0</b>
        </p>
        <button
          type="button"
          class="snake-gameover-restart"
          id="snake-gameover-restart"
        >
          restart
        </button>
        <p class="snake-gameover-hint">space / tap</p>
      </div>
    </div>
  </body>
</html>
