# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Changelog is generated from Conventional Commits.
# Anything that is not covered by a commit_parser is silently dropped
# via the catch-all at the end — this is intentional, see notes below.

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# The body iterates groups in a fixed order (not alphabetical) so that
# Features / Fixes always come before Chores, regardless of commit dates.
# Prettier runs afterwards and normalises blank lines.
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}

{% for group in ["🚨 Breaking Changes", "🚀 Features", "🐛 Bug Fixes", "⚡ Performance", "♻️ Refactoring", "📝 Documentation", "📦 Build System", "🔧 CI/CD", "⬆️ Dependencies", "🧹 Chores"] %}
{% set group_commits = commits | filter(attribute="group", value=group) %}
{% if group_commits | length > 0 %}
### {{ group }}

{% for commit in group_commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} — [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Bushmasterson/bushmasterson.github.io/commit/{{ commit.id }})
{% endfor %}

{% endif %}
{% endfor %}
"""

footer = """
---
_This changelog is generated automatically from [Conventional Commits](https://www.conventionalcommits.org/) by [git-cliff](https://git-cliff.org)._
"""

render_always = true
trim = true

[git]
conventional_commits = true
filter_commits = false
filter_unconventional = true
ignore_tags = ""
protect_breaking_commits = true
skip_tags = ""
sort_commits = "oldest"
split_commits = false
tag_pattern = "v[0-9]*.*"
topo_order = false

# Auto-link PRs, issues and commit SHAs in commit bodies
link_parsers = [
  # PR references: #123
  {pattern = "#(\\d+)", href = "https://github.com/Bushmasterson/bushmasterson.github.io/pull/$1"}, # Issue references: GH-123
  {pattern = "GH-(\\d+)", href = "https://github.com/Bushmasterson/bushmasterson.github.io/issues/$1"}, # Bare commit SHA: abc1234 (7-40 hex chars)
  {pattern = "\\b([0-9a-f]{7,40})\\b", href = "https://github.com/Bushmasterson/bushmasterson.github.io/commit/$1"},
]

# ---------------------------------------------------------------------------
# commit_parsers — ORDER MATTERS, first match wins.
#
# Layout:
#   1) skip patterns          — automation that must never show up
#   2) legacy one-off types   — must never show up either
#   3) breaking changes       — must come before feat/fix so they're picked up
#   4) conventional types     — ordered by importance
#   5) catch-all skip         — bulletproof: nothing sneaks through
# ---------------------------------------------------------------------------
commit_parsers = [
  # --- 1. Automation: skip silently ---------------------------------------
  {message = "^chore: update CHANGELOG", skip = true},
  {message = "^chore\\(changelog\\)", skip = true},
  {message = "^chore\\(release\\)", skip = true},
  {message = "^chore\\(version\\)", skip = true},
  {message = "^chore\\(ci\\): trigger", skip = true},
  {message = "^chore: refresh \\.(gitignore|prettierignore)", skip = true},
  {message = "^chore: format", skip = true},
  {message = "^chore: lint", skip = true},
  {message = "^chore: prettier", skip = true},
  {message = "^chore: merge", skip = true},
  {message = "^style", skip = true},
  {message = "^test", skip = true},
  {message = "^Merge ", skip = true},
  {message = "^Revert \"chore: update CHANGELOG", skip = true},
  {message = "^Revert \"chore\\(changelog\\)", skip = true}, # --- 2. Legacy / one-off commit types: skip silently --------------------
  {message = "^(reboot|wip|temp|misc|polish|cleanup|hotfix|revert|shore|tune|a11y|content|docs-?fix):", skip = true}, # --- 3. Breaking changes (highlighted, must come before feat/fix) -------
  {message = "^feat\\([^)]+\\)!: ", group = "🚨 Breaking Changes"},
  {message = "^feat!: ", group = "🚨 Breaking Changes"},
  {message = "^fix\\([^)]+\\)!: ", group = "🚨 Breaking Changes"},
  {message = "^fix!: ", group = "🚨 Breaking Changes"},
  {message = "^perf\\([^)]+\\)!: ", group = "🚨 Breaking Changes"},
  {message = "^perf!: ", group = "🚨 Breaking Changes"},
  {message = "^refactor\\([^)]+\\)!: ", group = "🚨 Breaking Changes"},
  {message = "^refactor!: ", group = "🚨 Breaking Changes"}, # --- 4. Conventional types: ordered by importance -----------------------
  {message = "^feat", group = "🚀 Features"},
  {message = "^fix", group = "🐛 Bug Fixes"},
  {message = "^perf", group = "⚡ Performance"},
  {message = "^refactor", group = "♻️ Refactoring"},
  {message = "^docs", group = "📝 Documentation"},
  {message = "^build", group = "📦 Build System"},
  {message = "^ci", group = "🔧 CI/CD"},
  {message = "^chore\\(deps\\)", group = "⬆️ Dependencies"},
  {message = "^chore\\(deps-dev\\)", group = "⬆️ Dependencies"},
  {message = "^chore\\(security\\)", group = "⬆️ Dependencies"},
  {message = "^chore", group = "🧹 Chores"}, # --- 5. Catch-all: bulletproof, drop anything that slipped through ------
  {message = ".*", skip = true},
]
