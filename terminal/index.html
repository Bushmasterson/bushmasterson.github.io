<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="bushmasterson — terminal."
    />
    <meta
      name="theme-color"
      content="#0f0f10"
    />
    <meta
      name="color-scheme"
      content="dark light"
    />

    <meta
      property="og:title"
      content="terminal | bushmasterson"
    />
    <meta
      property="og:url"
      content="https://bushmasterson.github.io/terminal/"
    />

    <title>terminal | bushmasterson</title>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0f10'/%3E%3Ctext x='16' y='22' font-family='ui-monospace, monospace' font-size='18' font-weight='600' fill='%235cb8ac' text-anchor='middle'%3E%26%26%3C/text%3E%3C/svg%3E"
    />

    <link
      rel="preload"
      as="style"
      href="../assets/css/main.css"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/icons/webfonts/fa-solid-900.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/icons/webfonts/fa-brands-400.woff2"
      crossorigin
    />

    <link
      rel="stylesheet"
      href="../assets/css/main.css"
    />

    <link
      rel="stylesheet"
      href="../assets/icons/css/all.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="../assets/icons/css/all.min.css"
      />
    </noscript>

    <script
      type="module"
      src="../assets/js/main.js"
    ></script>
  </head>

  <body>
    <button
      id="theme-toggle"
      type="button"
      class="theme-toggle"
      aria-label="Toggle theme"
    >
      <svg
        class="theme-icon theme-icon-sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="4"
          fill="currentColor"
        />
        <g
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M12 2v3" />
          <path d="M12 19v3" />
          <path d="M2 12h3" />
          <path d="M19 12h3" />
          <path d="m4.9 4.9 2.1 2.1" />
          <path d="m17 17 2.1 2.1" />
          <path d="m19.1 4.9-2.1 2.1" />
          <path d="m7 17-2.1 2.1" />
        </g>
      </svg>
      <svg
        class="theme-icon theme-icon-moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
        />
      </svg>
    </button>

    <canvas
      id="particles-canvas"
      aria-hidden="true"
    ></canvas>
    <button
      id="back-to-top"
      type="button"
      aria-label="Back to top"
      >↑</button
    >

    <main
      class="container container--terminal"
      id="main"
    >
      <article
        class="terminal-page"
        aria-label="Interactive terminal"
      >
        <div class="terminal-page-bar">
          <span class="term-dot"></span>
          <span class="term-dot"></span>
          <span class="term-dot"></span>
          <span class="term-title">bushmasterson@arch: ~</span>
        </div>
        <div
          class="terminal-page-output"
          id="term-output"
        >
          <div class="term-line term-line--muted">
            bushmasterson os v2.0 — type <span class="prompt">help</span> to
            begin
          </div>
        </div>
        <div class="terminal-page-prompt">
          <span class="prompt">~$</span>
          <input
            class="term-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Terminal input"
          />
        </div>
      </article>

      <p class="page-footer">
        <a href="../">← back to home</a>
      </p>
    </main>
  </body>
</html>
