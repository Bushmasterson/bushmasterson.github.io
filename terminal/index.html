<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="bushmasterson — terminal."
    />
    <meta
      name="theme-color"
      content="#0a0a0b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="color-scheme"
      content="dark light"
    />

    <meta
      property="og:title"
      content="terminal | bushmasterson"
    />
    <meta
      property="og:url"
      content="https://bushmasterson.github.io/terminal"
    />

    <title>terminal | bushmasterson</title>

    <script src="../assets/theme-init.js"></script>

    <link
      rel="preconnect"
      href="https://bushmasterson.github.io"
      crossorigin
    />
    <link
      rel="dns-prefetch"
      href="//bushmasterson.github.io"
    />

    <link
      rel="icon"
      href="../assets/favicon.svg"
      type="image/svg+xml"
    />

    <link
      rel="preload"
      as="style"
      href="../assets/css/main.css"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/icons/webfonts/fa-solid-900.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/icons/webfonts/fa-brands-400.woff2"
      crossorigin
    />

    <link
      rel="stylesheet"
      href="../assets/css/main.css"
    />

    <link
      rel="stylesheet"
      href="../assets/icons/css/all.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="../assets/icons/css/all.min.css"
      />
    </noscript>

    <link
      rel="stylesheet"
      href="../assets/css/disco.css"
    />

    <script
      type="module"
      src="../assets/js/main.js"
    ></script>
  </head>

  <body>
    <a
      class="skip-link"
      href="#main"
      >skip to content</a
    >

    <button
      id="theme-toggle"
      type="button"
      class="theme-toggle"
      aria-label="switch theme"
    >
      <svg
        class="theme-icon theme-icon-sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="4"
          fill="currentColor"
        />
        <g
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M12 2v3" />
          <path d="M12 19v3" />
          <path d="M2 12h3" />
          <path d="M19 12h3" />
          <path d="m4.9 4.9 2.1 2.1" />
          <path d="m17 17 2.1 2.1" />
          <path d="m19.1 4.9-2.1 2.1" />
          <path d="m7 17-2.1 2.1" />
        </g>
      </svg>
      <svg
        class="theme-icon theme-icon-moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
        />
      </svg>
    </button>

    <canvas
      id="particles-canvas"
      aria-hidden="true"
    ></canvas>
    <button
      id="back-to-top"
      type="button"
      aria-label="back to top"
      >↑</button
    >

    <main
      class="container container--terminal"
      id="main"
    >
      <article
        class="terminal-page"
        aria-label="interactive terminal"
      >
        <div class="terminal-page-bar">
          <span
            class="term-dot"
            aria-hidden="true"
          ></span>
          <span
            class="term-dot"
            aria-hidden="true"
          ></span>
          <span
            class="term-dot"
            aria-hidden="true"
          ></span>
          <span class="term-title">bushmasterson@arch: ~</span>
        </div>
        <div
          class="terminal-page-output"
          id="term-output"
          aria-live="polite"
          aria-atomic="false"
        >
          <div class="term-line term-muted">
            bushmasterson os v2.0 — type <span class="prompt">help</span> to
            begin
          </div>
        </div>
        <div class="terminal-page-prompt">
          <span class="prompt">~$</span>
          <input
            class="term-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="terminal input"
          />
        </div>
      </article>

      <p class="page-footer">
        <a href="..">← back to home</a>
      </p>
    </main>
  </body>
</html>
