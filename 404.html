<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#4a9b92"
    />
    <meta
      name="color-scheme"
      content="dark"
    />
    <meta
      name="robots"
      content="noindex"
    />

    <title>404 — page not found | bushmasterson</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0f10'/%3E%3Ctext x='16' y='22' font-family='ui-monospace, monospace' font-size='18' font-weight='600' fill='%235cb8ac' text-anchor='middle'%3E%26%26%3C/text%3E%3C/svg%3E"
    />

    <link
      rel="stylesheet"
      href="assets/icons/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="assets/css/main.css"
    />
    <script
      type="module"
      src="assets/js/main.js"
    ></script>

    <style>
      body.body-404 {
        display: block;
        align-items: initial;
        justify-content: initial;
        padding: 3rem 1.5rem;
        overflow-x: hidden;
        overflow-y: auto;
      }

      body.body-404::before {
        content: "";
        position: fixed;
        inset: -50%;
        background-image: radial-gradient(
          circle at center,
          rgba(92, 184, 172, 0.05) 0%,
          transparent 60%
        );
        pointer-events: none;
        z-index: 0;
      }

      .container--404 {
        position: relative;
        z-index: 1;
        width: min(100%, 520px);
        margin: 0 auto;
        text-align: left;
      }

      .prompt-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 1rem;
        letter-spacing: 0.02em;
      }

      .cursor {
        display: inline-block;
        color: var(--text);
        animation: blink404 0.9s steps(1) infinite;
        margin-left: 0.1em;
      }

      @keyframes blink404 {
        0%,
        40% {
          opacity: 1;
        }
        41%,
        100% {
          opacity: 0;
        }
      }

      .container--404 h1 {
        font-size: clamp(3rem, 12vw, 5.5rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 0 0 1.2rem;
        color: var(--text);
      }

      .container--404 h1 .digit {
        color: var(--accent);
        text-shadow: 0 0 24px var(--accent-glow);
        transition: text-shadow 0.5s var(--ease-out);
      }

      .container--404 h1:hover .digit {
        text-shadow: 0 0 36px var(--accent-glow);
      }

      .container--404 .message {
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--text-soft);
        margin: 0 0 1.8rem;
      }

      .container--404 .message code {
        color: var(--accent);
        background: var(--accent-dim);
        padding: 0.1em 0.4em;
        border-radius: 4px;
        font-size: 0.92em;
      }

      .container--404 .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .container--404 .action {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--text-soft);
        background: var(--surface);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        transition:
          color 0.3s var(--ease-out),
          border-color 0.3s var(--ease-out),
          background-color 0.3s var(--ease-out),
          transform 0.3s var(--ease-out);
      }

      .container--404 .action:hover {
        color: var(--accent-bright);
        border-color: var(--border-hover);
        transform: translateY(-1px);
      }

      .container--404 .action:focus-visible {
        outline: 2px solid var(--accent-bright);
        outline-offset: 3px;
      }

      .container--404 .action .key {
        font-size: 0.72rem;
        color: var(--muted);
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
        padding: 0.05em 0.4em;
        letter-spacing: 0.05em;
      }

      .container--404 .footer {
        margin-top: 2rem;
        font-size: 0.78rem;
        color: var(--muted);
        font-style: italic;
        opacity: 0.75;
      }

      @media (max-width: 480px) {
        body.body-404 {
          padding: 2rem 1.25rem;
        }

        .container--404 h1 {
          font-size: clamp(2.5rem, 15vw, 4rem);
        }

        .container--404 .message {
          font-size: 0.9rem;
        }

        .container--404 .action {
          padding: 0.55rem 0.9rem;
          font-size: 0.8rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor {
          animation: none;
          opacity: 1;
        }

        .container--404 * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body class="body-404">
    <div class="container container--404">
      <div class="prompt-line">
        <span class="prompt">bushmasterson@arch:~$</span>
        <span>cd /requested/path</span>
        <span
          class="cursor"
          aria-hidden="true"
          >|</span
        >
      </div>

      <h1>
        <span class="digit">4</span><span class="digit">0</span
        ><span class="digit">4</span>
      </h1>

      <p class="message">
        no such file or directory. the page you're looking for doesn't exist,
        was moved, or never did. <code>errno 2</code>
      </p>

      <div class="actions">
        <a
          class="action"
          href="/"
        >
          <span>cd ~</span>
          <span class="key">HOME</span>
        </a>
        <button
          class="action"
          type="button"
          onclick="history.back()"
        >
          <span>cd ..</span>
          <span class="key">BACK</span>
        </button>
      </div>

      <p class="footer">— nothing to see here, move along.</p>

      <section
        class="snake-section"
        aria-label="Snake game"
      >
        <div class="snake-header">
          <span class="prompt">~$</span>
          <span>./snake.exe</span>
        </div>

        <div class="snake-canvas-wrap">
          <canvas
            id="snake-canvas"
            width="320"
            height="320"
          ></canvas>
        </div>

        <div class="snake-footer">
          <span class="snake-stat">
            <span class="meta-label">score</span>
            <b id="snake-score">0</b>
          </span>
          <span class="snake-stat snake-hint">
            <span class="meta-label">keys</span> ↑↓←→ / wasd · space pause
          </span>
          <button
            class="snake-restart"
            type="button"
            id="snake-restart"
          >
            restart
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
