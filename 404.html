<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0f0f10"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#faf8f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="color-scheme"
      content="dark light"
    />
    <meta
      name="robots"
      content="noindex"
    />

    <title>404 — page not found | bushmasterson</title>

    <script src="assets/theme-init.js"></script>

    <link
      rel="preconnect"
      href="https://bushmasterson.github.io"
      crossorigin
    />
    <link
      rel="dns-prefetch"
      href="//bushmasterson.github.io"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0f10'/%3E%3Ctext x='16' y='22' font-family='ui-monospace, monospace' font-size='18' font-weight='600' fill='%235cb8ac' text-anchor='middle'%3E%26%26%3C/text%3E%3C/svg%3E"
    />

    <link
      rel="preload"
      as="style"
      href="assets/css/main.css"
    />
    <link
      rel="stylesheet"
      href="assets/css/main.css"
    />
    <link
      rel="stylesheet"
      href="assets/icons/css/all.min.css"
    />
    <script
      type="module"
      src="assets/js/main.js"
    ></script>
  </head>

  <body class="body-404">
    <button
      id="theme-toggle"
      type="button"
      class="theme-toggle"
      aria-label="Toggle theme"
    >
      <svg
        class="theme-icon theme-icon-sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="4"
          fill="currentColor"
        />
        <g
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M12 2v3" />
          <path d="M12 19v3" />
          <path d="M2 12h3" />
          <path d="M19 12h3" />
          <path d="m4.9 4.9 2.1 2.1" />
          <path d="m17 17 2.1 2.1" />
          <path d="m19.1 4.9-2.1 2.1" />
          <path d="m7 17-2.1 2.1" />
        </g>
      </svg>
      <svg
        class="theme-icon theme-icon-moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="currentColor"
          d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
        />
      </svg>
    </button>

    <div class="container container--404">
      <div class="prompt-line">
        <span class="prompt">bushmasterson@arch:~$</span>
        <span>cd /requested/path</span>
        <span
          class="cursor"
          aria-hidden="true"
          >|</span
        >
      </div>

      <h1>
        <span class="digit">4</span><span class="digit">0</span
        ><span class="digit">4</span>
      </h1>

      <p class="message">
        no such file or directory. the page you're looking for doesn't exist,
        was moved, or never did. <code>errno 2</code>
      </p>

      <div class="actions">
        <a
          class="action"
          href="/"
        >
          <span>cd ~</span>
          <span class="key">HOME</span>
        </a>
        <button
          class="action"
          type="button"
          onclick="history.back()"
        >
          <span>cd ..</span>
          <span class="key">BACK</span>
        </button>
        <a
          class="action action--snake"
          href="snake/"
        >
          <span
            ><i
              class="fas fa-gamepad"
              aria-hidden="true"
            ></i>
            ./snake.exe</span
          >
          <span class="key">PLAY</span>
        </a>
      </div>

      <p class="footer">— nothing to see here, move along.</p>
    </div>
  </body>
</html>
