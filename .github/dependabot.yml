version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/Moscow'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
    groups:
      dev-dependencies:
        patterns:
          - 'typescript'
          - 'prettier'
          - '@types/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/Moscow'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
      include: scope
    labels:
      - ci
