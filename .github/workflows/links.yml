name: Links

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'src/ts/features/terminal-page.ts'
      - '.lycheeignore'
      - '.github/workflows/links.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'src/ts/features/terminal-page.ts'
      - '.lycheeignore'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for broken links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --cache --max-cache-age 1d --accept
            200,204,206,301,302,303,307,308,403,429 './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
