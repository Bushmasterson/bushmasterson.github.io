name: Stale

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  close-stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close stale
        uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7

          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 14 days if no further activity occurs.

          close-issue-message: |
            This issue was closed because it has been inactive for 14 days since being marked as stale. Reopen if it is still relevant.

          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs.

          close-pr-message: |
            This PR was closed because it has been inactive for 7 days since being marked as stale.

          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security,dependencies'
          exempt-draft-pr: true

          operations-per-run: 30
