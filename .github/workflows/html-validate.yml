name: HTML Validate

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.htmlvalidate.json'
      - '.github/workflows/html-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '.htmlvalidate.json'
      - '.github/workflows/html-validate.yml'
  workflow_dispatch:

concurrency:
  group: html-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npx --yes html-validate "**/*.html"
