name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changelog
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Double protection against the self-referencing loop:
    # (1) this condition skips the job when the push itself was a changelog commit
    # (2) cliff.toml also skips ^chore: update CHANGELOG commits
    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'update CHANGELOG')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Format changelog
        run: npx prettier --write CHANGELOG.md

      - name: Verify formatting matches repo rules
        run: npx prettier --check CHANGELOG.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update CHANGELOG'
          title: 'chore: update CHANGELOG'
          body: |
            Auto-generated from conventional commits since the last update.

            Skipped commit types: `chore: update CHANGELOG`, `chore(release)`,
            `style`, `test`, and legacy one-off types.

            Generated by [git-cliff](https://git-cliff.org).
          branch: chore/update-changelog
          delete-branch: true
          add-paths: CHANGELOG.md
