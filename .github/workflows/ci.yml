name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check .

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build with Vite
        run: npx vite build

      - name: Verify build output
        run: |
          test -f assets/js/main.js || (echo "main.js missing" && exit 1)
          test -f assets/js/main.js.map || (echo "main.js.map missing" && exit 1)
          echo "Build output verified."
